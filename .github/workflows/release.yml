name: Release

on:
  push:
    tags:
      - "v*.*.*"
      - "v*.*.*a*"
      - "v*.*.*b*"
      - "v*.*.*rc*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ---------------------------------------------------------------------------
  # Build the cross-platform PyInstaller bundle on every supported OS.
  # ---------------------------------------------------------------------------
  bundle:
    name: PyInstaller bundle (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Linux Qt dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 libgl1 libxkbcommon-x11-0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-sync1 libxcb-xfixes0 libxcb-xinerama0 \
            libxcb-cursor0 libdbus-1-3 libxcb-xkb1

      - name: Install package and build deps
        run: |
          python -m pip install --upgrade pip
          pip install -e .[build]

      - name: Build PyInstaller bundle (icons + PyInstaller)
        run: python installer/build.py --skip-iscc

      - name: Smoke-test the bundle (Linux/macOS)
        if: runner.os != 'Windows'
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          set -e
          ls installer/dist/DeltaSuite
          installer/dist/DeltaSuite/DeltaSuite --version

      - name: Smoke-test the bundle (Windows)
        if: runner.os == 'Windows'
        run: |
          dir installer\dist\DeltaSuite
          installer\dist\DeltaSuite\DeltaSuite.exe --version

      - name: Upload bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: deltasuite-bundle-${{ matrix.os }}
          path: installer/dist/DeltaSuite

  # ---------------------------------------------------------------------------
  # Wrap the Windows bundle into an Inno Setup installer.
  # ---------------------------------------------------------------------------
  windows-installer:
    name: Windows Inno Setup installer
    needs: bundle
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download Windows bundle
        uses: actions/download-artifact@v4
        with:
          name: deltasuite-bundle-windows-latest
          path: installer/dist/DeltaSuite

      - name: Determine version
        id: version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if ($tag -like "v*") { $tag = $tag.Substring(1) }
          if ([string]::IsNullOrEmpty($tag)) { $tag = "0.1.0" }
          "version=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Compile installer
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          & "$iscc" "/DMyAppVersion=${{ steps.version.outputs.version }}" `
            installer\deltasuite.iss

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: deltasuite-windows-installer
          path: installer/dist/installer/*.exe

  # ---------------------------------------------------------------------------
  # Build wheel + sdist and publish to PyPI via trusted publishing.
  # ---------------------------------------------------------------------------
  publish-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/deltasuite
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Upload distribution artifact
        uses: actions/upload-artifact@v4
        with:
          name: deltasuite-pypi-dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  # ---------------------------------------------------------------------------
  # Attach all artifacts to the GitHub release page.
  # ---------------------------------------------------------------------------
  github-release:
    name: Create GitHub Release
    needs: [bundle, windows-installer, publish-pypi]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Repackage bundle folders
        shell: bash
        run: |
          set -e
          mkdir -p release-assets
          for dir in artifacts/deltasuite-bundle-*; do
            base="$(basename "$dir")"
            (cd "$dir" && zip -r "../../release-assets/${base}.zip" .)
          done
          cp artifacts/deltasuite-windows-installer/*.exe release-assets/ || true
          cp artifacts/deltasuite-pypi-dist/*.tar.gz release-assets/ || true
          cp artifacts/deltasuite-pypi-dist/*.whl release-assets/ || true
          ls -lh release-assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, 'a') || contains(github.ref, 'b') || contains(github.ref, 'rc') }}
